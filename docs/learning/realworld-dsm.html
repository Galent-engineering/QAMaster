*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:13px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 16px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
header h1{font-size:16px;margin:0}
header .meta{color:var(--muted);font-size:12px}
.stats{display:flex;flex-wrap:wrap;gap:8px;margin-left:auto}
.stat{padding:2px 8px;border:1px solid var(--line);border-radius:999px;font-size:12px;color:var(--muted)}
.stat b{color:var(--ink)}
.toolbar{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding:8px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
.toolbar label{display:inline-flex;gap:5px;align-items:center;color:var(--muted)}
select,input[type=search],button{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:4px 8px}
button{cursor:pointer}button:hover{border-color:var(--accent)}
button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.types{display:inline-flex;flex-wrap:wrap;gap:4px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border:1px solid var(--line);border-radius:999px;cursor:pointer;user-select:none}
.chip i{width:10px;height:10px;border-radius:2px;display:inline-block}
.chip.off{opacity:.4}
main{display:flex;height:calc(100% - 96px);min-height:300px}
#wrap{position:relative;flex:1;overflow:auto;outline:none}
#spacer{position:absolute;top:0;left:0;pointer-events:none}
#cv{position:sticky;top:0;left:0;display:block}
aside{width:380px;max-width:42vw;border-left:1px solid var(--line);background:var(--panel);overflow:auto;padding:12px 14px}
aside h2{font-size:14px;margin:4px 0 8px}
aside h3{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:14px 0 6px}
.tabs{display:flex;gap:4px;margin-bottom:8px;flex-wrap:wrap}
.kv{display:grid;grid-template-columns:110px 1fr;gap:3px 8px;word-break:break-word}
.kv dt{color:var(--muted)}.kv dd{margin:0}
ul.list{margin:0;padding-left:18px}ul.list li{margin:2px 0;word-break:break-word}
.flag{display:inline-block;font-size:11px;padding:0 6px;border-radius:999px;border:1px solid var(--line);margin:0 3px 3px 0}
.flag.broken,.flag.unresolved{color:var(--removed);border-color:var(--removed)}
.flag.code-only,.flag.orphan{color:var(--warn);border-color:var(--warn)}
.flag.added{color:var(--added);border-color:var(--added)}
a{color:var(--accent)}
.muted{color:var(--muted)}
code{font-size:12px}
#tip{position:fixed;pointer-events:none;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 8px;
font-size:12px;max-width:420px;box-shadow:0 4px 16px rgba(0,0,0,.18);display:none;z-index:5}
.linkbtn{background:none;border:none;padding:0;color:var(--accent);cursor:pointer;text-align:left}
@media (max-width:820px){main{flex-direction:column;height:auto}#wrap{height:70vh;flex:none}aside{width:auto;max-width:none;border-left:none;border-top:1px solid var(--line)}}
</style>

function save(){try{localStorage.setItem('dsm-view',JSON.stringify({level:st.level,order:st.order,cs:st.cs}));}catch(e){}}
$('level').onchange=e=>{st.level=e.target.value;st.sel=null;st.off.clear();st.module='';chips();modules();save();compute();panel();};
$('order').onchange=e=>{st.order=e.target.value;save();compute();};
$('module').onchange=e=>{st.module=e.target.value;compute();};
$('flagf').onchange=e=>{st.flag=e.target.value;compute();};
$('q').oninput=e=>{st.q=e.target.value;compute();};
$('zoom').oninput=e=>{st.cs=+e.target.value;save();compute();};
$('theme').onclick=()=>{const r=document.documentElement,cur=r.dataset.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');r.dataset.theme=cur==='dark'?'light':'dark';draw();};
function download(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);}
$('csv').onclick=()=>{const {ord,N,cellMap,n}=view;const q=s=>'"'+String(s).replace(/"/g,'""')+'"';
  const rows=[['',...ord.map(v=>q(N[v].label))].join(',')];
  for(const r of ord)rows.push([q(N[r].label),...ord.map(c=>{const cell=cellMap.get(r*n+c);return cell?Object.entries(cell.t).filter(([k])=>!st.off.has(k)).reduce((a,[,v])=>a+v,0)||'':(r===c?'X':'');})].join(','));
  download('dsm-'+st.level+'.csv',rows.join('\n'),'text/csv');};
$('json').onclick=()=>download('dsm.json',JSON.stringify(D),'application/json');
$('meta').textContent=(D.base_url||'')+' · updated '+new Date(D.generated_at).toLocaleString();
$('stats').innerHTML=[['Screens',D.stats.pages],['Relations',D.stats.page_relations],['Elements',D.stats.elements],['Cycles',D.stats.cycles],['Code only',D.stats.flags['code-only']],['Broken',D.stats.flags.broken]].map(([k,v])=>'<span class="stat">'+k+' <b>'+v+'</b></span>').join('');
$('level').value=st.level;$('order').value=st.order;$('zoom').value=st.cs;
chips();modules();compute();panel();
</script>
</body>
</html>
